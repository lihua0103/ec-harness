packages:
  - 'packages/enterprise/*'

# profiles/enterprise 刻意不在此列：官方要求 profile 目录是独立的 pnpm 根
# （initProfile 会为它写 nodeLinker: hoisted + autoInstallPeers: false），
# 且 dsh 会在 $DSH_HOME/profiles/node_modules 维护扁平回退链接。把 profile
# 收成企业 workspace 成员会让这两套模块布局假设互相冲突。

# pnpm 11 起，以下设置由 pnpm-workspace.yaml 承载；写在 .npmrc 里不再生效
# （pnpm config get 会返回 undefined），因此企业基线统一放在这里。
packageManagerStrict: true
engineStrict: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true
saveExact: true
autoInstallPeers: false

# 安装期允许执行构建脚本的包白名单。等价于授权该包在沙箱外于本机执行代码，
# 新增条目必须走 ADR。
# esbuild=true：vitest 依赖；pnpm 11 脚手架曾在此留占位符，2026-08-26 落定。
allowBuilds:
  esbuild: true
