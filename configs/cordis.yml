# DSH Guard Cordis 配置
# 文档: https://cordis.js.org/

# 全局配置
$global:
  logLevel: info

# 插件列表
plugins:
  # 临床数据守护插件（新）
  - name: '@dsh-guard/clinical-guard'
    config:
      # 数据安全开关（核心功能，默认开启）
      dataEgressControl:
        enabled: true  # 主开关：false 时不做任何拦截
        
        # SAS 数据集出域 AI 拦截
        sasDatasetEgress:
          enabled: true
          aiInterception: true
        
        # Spec 需求数据出域 AI 拦截
        specDataEgress:
          enabled: true
          aiInterception: true
      
      # 表头检测
      headerDetection:
        enabled: true
        aiEnhanced: true
      
      # EDC 字段识别
      edcFieldRecognition:
        enabled: true
        systems:
          - Medidata
          - Oracle
          - Veeva
      
      # Listing 模板
      listingTemplate:
        enabled: true
        standardTemplates: true
        customTemplates: []
      
      # 可选配置
      # pythonPath: /path/to/python
      # auditLogPath: /path/to/audit/logs
  
  # 企业认证插件（示例）
  - name: '@dsh-guard/enterprise-auth'
    disabled: true
    config:
      enabled: true
      provider: oauth2
      oauth2:
        clientId: ${OAUTH2_CLIENT_ID}
        clientSecret: ${OAUTH2_CLIENT_SECRET}
        authorizationUrl: ${OAUTH2_AUTH_URL}
        tokenUrl: ${OAUTH2_TOKEN_URL}
        userInfoUrl: ${OAUTH2_USERINFO_URL}
      sessionTimeout: 3600000
      mfaEnabled: false
