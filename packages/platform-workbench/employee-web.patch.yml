# 员工 Web profile 叠加层（单侧栏架构 2026-11-21 · ADR-0003 2026-11-25 修订）。
#
# 用途：员工界面只保留一套左侧导航——企业工作台的 `sidebar` 占位者。本文件按锁定版公开的
# Cordis 配置语义（`disabled: true` 保留条目但跳过挂载）禁用默认 `ui-sidebar` 客户端 bundle，
# 以及员工 Web 不得暴露的 agent 侧治理工具（插件管理/定时/目标）与 HMR。
# 企业导航由此成为 `sidebar` slot 的唯一占位者；UI 隐藏不充当服务端授权，服务端授权仍由控制面承担。
#
# 应用方式（二选一，回退以移除叠加层/取消 disabled 为单位）：
# 1. 启动叠加：dsh web 启动参数追加 `--patch <repo>/packages/platform-workbench/employee-web.patch.yml`
#    （不改 profile 目录，适合隔离装配探针）。
# 2. profile 层合并：node scripts/apply-employee-web-profile.cjs --profile <DSH_HOME>/profiles/web
#    （幂等合并进该 profile 的 cordis.patch.yml 用户层；--rollback 移除）。
- id: ui-sidebar
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: schedule
  disabled: true
- id: tool-schedule
  disabled: true
- id: goal
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: hmr
  disabled: true
