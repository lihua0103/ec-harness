- insert:
  - id: clinical-data-guard
    name: emerald-clinical-data-guard
    config:
      brandName: Emerald Clinical
      brandShortName: Emerald
      localDataAccess: uat-local
      # 2026-08-24：加密归档凭据通道。此前未配置，credentialRef 一律硬拒
      # "credentials directory is not configured"——用户在会话里给出 zip
      # 密码后系统无通道接收（真实会话复现）。目录指向临床工作区之外的
      # 系统目录：workspace glob 列不到凭据文件，绝对路径读取由
      # isCredentialPath 投影为占位符，原值只在本地工具间流转。
      credentialsDir: G:\home\dsh-guard\credentials
