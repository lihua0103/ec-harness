<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emerald 工作台 · 对话导航草图</title>
<style>
:root{font:15px/1.55 'Microsoft YaHei UI','PingFang SC',sans-serif;color:#183742;background:#f4f8f8;--deep:#103f48;--accent:#006e66;--rule:#cbdad9;--sub:#506a70}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{color:inherit;cursor:pointer;background:none;border:0}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #d6952e;outline-offset:2px}button:disabled{cursor:default}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.side{background:var(--deep);color:white;padding:25px 16px}.brand{font-size:21px;font-weight:750;margin:0 10px 28px}.brand small{font-weight:400;color:#c4dbdc;font-size:13px}.side h2,.side summary{font-size:13px;color:#c0d5d6;margin:22px 10px 8px}.side summary{cursor:pointer}.row{width:100%;text-align:left;display:block;padding:10px 12px;border-radius:5px;margin-bottom:3px}.side .row:hover,.side .row[aria-current=true]{background:#255761}.side .row[aria-current=true]{box-shadow:inset 3px 0 #74e2c6}.row b{display:block;font-size:15px}.row small{color:#c2d8da}.all{width:100%;text-align:left;color:#ceece7;padding:10px 12px}.side details{border-top:1px solid #41656b;margin-top:13px}.side details p{padding-left:12px;font-size:14px;color:#d6e3e5}.main{min-width:0;display:flex;flex-direction:column}.bar{background:white;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 26px;color:var(--sub);font-size:13px}.bar span:last-child{color:#34645f}.content{display:flex;flex-direction:column;flex:1}.header{padding:22px max(24px,5vw) 17px;background:white;border-bottom:1px solid var(--rule)}h1{font-size:25px;line-height:1.35;margin:5px 0}.meta{color:var(--sub);font-size:13px}.stage{padding:30px max(24px,5vw);flex:1;display:flex;flex-direction:column}.chat{max-width:830px;width:100%;align-self:center}.message{max-width:78%;margin:15px 0 25px}.message.mine{margin-left:auto;background:#dfefeb;padding:12px 17px;border-radius:12px 12px 2px 12px}.message p{margin:4px 0}.who{font-size:13px;font-weight:650;color:#32605f}.composer{margin:34px auto 0;max-width:830px;width:100%;padding:16px 19px;background:white;border:1px solid var(--rule);border-radius:12px;color:var(--sub)}.state{max-width:620px;margin:36px auto;width:100%}.state h2{font-size:21px}.state p{color:var(--sub)}.action{background:var(--accent);color:white;padding:8px 15px;border-radius:5px;margin:4px 6px 4px 0}.quiet{border:1px solid var(--rule);border-radius:5px;padding:7px 12px;background:white}.search{padding:10px 13px;border:1px solid var(--rule);border-radius:6px;width:min(100%,520px);margin-bottom:15px}.hit{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--rule)}.hit:hover{background:#e6f2ef}.hit b{display:block}.foot{padding:10px 24px;border-top:1px dashed var(--rule);color:var(--sub);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}.foot button{text-decoration:underline;color:var(--accent)}.tabs{color:var(--accent);font-size:14px;margin-top:12px}.mobile{display:none}@media(max-width:720px){.layout{display:block}.main{min-height:100vh}.side{display:none}.layout.navopen .side{display:block}.mobile{display:inline-block}.bar{padding:10px 14px}.header,.stage{padding:18px}.message{max-width:92%}.foot{padding:9px 15px}}
</style><div class="layout" id="layout"><aside class="side" aria-label="工作台导航"><p class="brand">Emerald <small>工作台</small></p><h2>最近对话</h2><div id="recent"></div><button class="all" id="all">查看全部历史会话 ›</button><details><summary>工作索引</summary><p>SH-202 DVP 训练<br>DXP DVP 训练<br>ATG DVP 生成</p></details></aside><main class="main"><div class="bar"><span><button class="mobile quiet" id="menu">导航</button> 工作台 / <span id="crumb">对话</span></span><span>交互草图 · 全部为示例数据</span></div><div class="content" id="content"></div><footer class="foot">原型演示，不连接业务系统 <button id="fail">演示打开失败</button><button id="reset">回到初始视图</button></footer></main></div>
<script>
const rows=[['检查计划复核','SH-202 DVP 训练','运行对话','今天 16:17','793a4ea0'],['训练任务讨论','SH-202 DVP 训练','工作对话','今天 15:00',''],['模板差异核对','DXP DVP 训练','运行对话','今天 09:28','a677f67a'],['字段映射复核','ATG DVP 生成','运行对话','周四 11:20','81b7453a']];const $=id=>document.getElementById(id);let active=1,order=[0,1,2],version=0,screen='chat',fromHistory=false,query='';const header=(title,meta)=>`<header class="header"><div class="meta">${meta}</div><h1 tabindex="-1">${title}</h1></header>`;function nav(){ $('recent').innerHTML=order.slice(0,3).map(i=>`<button class="row" data-open="${i}" aria-current="${screen!=='list'&&i===active}"><b>${rows[i][0]}</b><small>${rows[i][1]} / ${rows[i][2]}</small></button>`).join('');$('crumb').textContent=screen==='list'?'历史会话':'对话';$('layout').classList.remove('navopen') }function heading(){const r=rows[active];return header(r[0],`${r[1]} / ${r[2]}　${r[3]}`)}function back(){return fromHistory?'<button class="quiet" data-back>返回搜索结果</button>':''}function focusTitle(){ $('content').querySelector('h1')?.focus({preventScroll:true}) }
function chat(move=false){screen='chat';nav();const r=rows[active];$('content').innerHTML=heading()+`<section class="stage"><div class="chat">${back()}<div class="tabs">对话</div><div class="message mine"><div class="who">我</div><p>我们上次讨论的是哪项工作？</p></div><div class="message"><div class="who">工作台助手</div><p>这段对话的主题是「${r[0]}」，属于「${r[1]}」。</p></div></div><div class="composer" aria-label="草图中的输入区域，不可发送">继续「${r[0]}」的对话…</div></section>`;if(move)focusTitle()}
function openChat(i,fail=false,origin=screen==='list'){const n=++version;active=i;fromHistory=origin;screen='loading';nav();$('content').innerHTML=heading()+'<section class="stage"><div class="state" role="status">正在打开这段对话…</div></section>';focusTitle();setTimeout(()=>{if(n!==version)return;if(fail){screen='error';$('content').innerHTML=heading()+`<section class="stage"><div class="state" role="alert"><h2>暂时打不开这段运行对话</h2><p>运行已完成，但工作台找不到对应的会话记录。当前未打开其他对话，也不能发送消息。</p><div class="meta">运行编号 ${rows[i][4]}</div><p><button class="action" id="retry">重试</button><button class="quiet" id="tohistory">返回历史会话</button></p></div></section>`;$('retry').onclick=()=>openChat(i,false,origin);$('tohistory').onclick=list;focusTitle()}else{order=[i,...order.filter(v=>v!==i)];chat(true)}},420)}
function hits(){const q=query.trim().toLowerCase();const matches=rows.map((r,i)=>({r,i})).filter(({r})=>r.join(' ').toLowerCase().includes(q));$('hits').innerHTML=matches.map(({r,i})=>`<button class="hit" data-open="${i}"><span><b>${r[0]}</b><small class="meta">${r[1]} / ${r[2]}</small></span><small class="meta">${r[3]}</small></button>`).join('')||'<p>没有匹配的对话。试试工作名称，或清除搜索。</p>'}function list(){version++;screen='list';nav();$('content').innerHTML=header('历史会话','工作台')+'<section class="stage"><label for="query">搜索对话</label><input class="search" id="query" placeholder="输入对话标题、工作名称或运行编号"><div id="hits"></div></section>';$('query').value=query;hits();$('query').oninput=e=>{query=e.target.value;hits()};$('query').focus()}
$('layout').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openChat(Number(b.dataset.open));if(e.target.closest('[data-back]'))list()});$('all').onclick=list;$('menu').onclick=()=>$('layout').classList.toggle('navopen');$('fail').onclick=()=>openChat(0,true);$('reset').onclick=()=>{version++;active=1;order=[0,1,2];fromHistory=false;query='';chat()};chat();
</script></html>
