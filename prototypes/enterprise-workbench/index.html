<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#004b61">
  <title>EMERALD · DSH AI 智能平台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至工作区</a>
  <aside class="sidebar" aria-label="平台导航">
    <a class="brand" href="#workspace" aria-label="EMERALD 工作区"><img src="brand.svg" width="188" height="53" alt="EMERALD CLINICAL TRIALS"></a>
    <div class="product-name">DSH AI 智能平台</div>
    <button class="new-task" data-action="new-task"><span aria-hidden="true">＋</span> 新建工作</button>
    <nav id="nav"></nav>
    <div class="recent-label">最近工作</div>
    <div id="recent-tasks" class="recent-tasks"></div>
    <div class="sidebar-bottom"><a href="#settings" class="engine-state"><span class="status-dot"></span><span>DSH 未接入<small>当前为交互原型</small></span></a><div class="profile"><span class="avatar">体</span><span>体验账号<small>仅本浏览器保存</small></span><button class="icon-button" data-action="help" aria-label="使用说明">?</button></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="header-left"><button class="icon-button menu-button" data-action="menu" aria-label="展开导航" aria-expanded="false">☰</button><span id="breadcrumb">AI 工作区</span></div><div class="header-right"><span id="save-state" class="save-state" role="status">已保存到本浏览器</span><span class="prototype-label">交互原型 · 不连接真实模型</span><button class="text-button" data-action="help">使用说明</button></div></header>
    <div id="storage-warning" class="storage-warning" role="status" hidden></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input id="file-picker" type="file" multiple hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
