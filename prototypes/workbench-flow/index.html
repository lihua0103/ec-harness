</style></head><body><header class="top"><b class="logo">Emerald</b><div class="projects" id="projects"></div><div class="utils" id="utils"></div></header><div class="layout" id="layout"><aside id="side"></aside><main class="main"><header class="head" id="head"></header><div class="body"><section class="center" id="center"></section><section class="panel" id="panel"></section></div><footer class="foot" id="foot"></footer></main></div><script>
const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let en=false;const t=(a,b)=>en?b:a,txt=v=>Array.isArray(v)?v[+en]:v;
const projects=['SH-202','DXP','Atlas'],works=[{p:0,n:['DVP 训练','DVP training'],a:'DVP'},{p:0,n:['模板复核','Template review'],a:'Listing'},{p:1,n:['DVP 生成','DVP generation'],a:'DVP'}],sessions=[{w:0},{w:1},{w:2},{w:0,n:['检查计划复核','Check plan review'],r:'793a4ea0'},{w:2,n:['生成结果核对','Output review'],r:'a677f67a'}],agents=['DVP','Listing','Visualization'];let p=0,s=0,mode='ready',panel='',filter='',prev=null,version=0,app=agents[0],rec=[3,4],last=[0,4,null],invoker=null;const name=i=>txt(sessions[i].n||works[sessions[i].w].n),wname=i=>txt(works[i].n),kind=i=>sessions[i].r?t('运行对话','Run chat'):t('工作对话','Work chat'),wSession=i=>sessions.findIndex(v=>v.w===i&&!v.r),btn=(key,val,label,cls='',extra='')=>`<button data-${key}="${esc(val)}" class="${cls}" ${extra}>${label}</button>`,section=(title,content)=>`<h3>${title}</h3>${content}`,item=(k,v,title,sub='')=>btn(k,v,`<b>${esc(title)}</b><small>${esc(sub)}</small>`,'item'),navrow=(k,v,title,sub,active)=>btn(k,v,`${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}`,`sidebtn${active?' active':''}`,active?'aria-current="page"':'');
function chrome(){const a=s===null?null:sessions[s];$('projects').innerHTML=`<span class="sub">${t('切换项目','Switch project')}</span>`+projects.slice(0,2).map((n,i)=>btn('project',i,n,i===p?'selected':'',`aria-pressed="${i===p}"`)).join('')+btn('panel','projects',t('全部项目','All projects'));$('utils').innerHTML=btn('menu','',t('工作与对话','Work & chats'),'mobile')+btn('panel','search',t('搜索','Search'))+btn('panel','inbox',t('待处理 1','Inbox 1'))+btn('panel','tools',t('工具','Tools'))+btn('lang','',t('EN','中文'),'','aria-label="Switch language / 切换语言"');$('side').innerHTML=`<h2 class="sideTitle">${projects[p]} ${btn('closemenu','',t('收起','Close'),'mobile')}</h2>`+btn('panel','new','＋ '+t('新建工作','New work'),'new')+`<h3 class="group">${t('打开工作对话','Open a work chat')}</h3>`+(works.map((v,i)=>v.p===p?navrow('work',i,wname(i),'',s===wSession(i)):'').join('')||`<span class="emptySide">${t('暂无工作','No work yet')}</span>`)+`<h3 class="group">${t('回看运行对话','Revisit a run chat')}</h3>`+(rec.filter(i=>works[sessions[i].w].p===p).slice(0,4).map(i=>navrow('session',i,name(i),wname(sessions[i].w),i===s)).join('')||`<span class="emptySide">${t('暂无最近访问的运行','No recently viewed runs')}</span>`)+btn('panel','history',t('查看项目全部对话','All chats in this project'),'sidebtn all');$('head').innerHTML=`<div>${prev!==null?btn('back','',t('‹ 返回：','‹ Back to ')+esc(name(prev)),'link back'):''}<div class="sub">${projects[p]}${a?' / '+kind(s)+(a.r?' / '+esc(wname(a.w)):''):''}</div><h1 id="title" tabindex="-1">${a?esc(name(s)):projects[p]}</h1></div>`+btn('panel','details',t('资料与运行','Files & runs'),'outline');$('foot').innerHTML=`<span>${t('交互设计样稿 · 虚构数据 · 中央为原生 Chat 示意','Interaction prototype · Fictional data · Native chat placeholder')}</span>`+btn('fail','',t('演示无法打开会话','Simulate unavailable chat'))}
function conversation(){const a=s===null?null:sessions[s];if(mode==='ready'&&a){$('center').innerHTML=`<div class="tabs"><strong>${t('对话','Chat')}</strong>${t('轨迹','Trace')}</div><div class="stream"><div class="mine">${t('继续讨论','Let’s continue with ')}${esc(name(s))}${t('。','.')}</div><div class="assistant"><b class="mark">◇</b><strong>${esc(works[a.w].a)} ${t('智能体','agent')}</strong></div><p>${t('这里是这段对话上次停下的位置。','This is where you left off in this conversation.')}</p></div><div class="compose">${t('继续当前对话…','Continue this conversation…')}</div>`}else{const title=mode==='error'?t('打不开这段运行对话','This run chat is unavailable'):mode==='loading'?t('正在打开所选对话…','Opening the selected chat…'):t('从一项工作开始','Start with a work item');$('center').innerHTML=`<div class="stream state" role="${mode==='error'?'alert':'status'}"><h2>${title}</h2>${mode==='error'?`<p>${t('工作台找不到对应的会话记录。没有切换到其他对话，当前不能发送消息。','The session record could not be found. No other chat is open and sending is disabled.')}</p><div class="actions">${btn('retry','',t('重试','Retry'),'action')}${btn('panel','history',t('查找其他对话','Find another chat'),'outline')}</div>`:mode==='empty'?works.map((w,i)=>w.p===p?item('work',i,wname(i)):'').join('')+btn('panel','new',t('新建工作','New work'),'action'):''}</div>`}}
const titles={projects:['全部项目','All projects'],history:['项目历史对话','Project chat history'],search:['全局搜索','Search workspace'],inbox:['待处理','Inbox'],task:['复核检查计划','Review the check plan'],details:['资料与运行','Files & runs'],tools:['工作台工具','Workspace tools'],agents:['智能体目录','Agent catalog'],prefs:['平台设置','Platform settings'],space:['项目工作空间','Project workspace'],new:['新建工作','New work'],run:['发起运行','Start run']};function matches(){const global=panel==='search',q=filter.trim().toLowerCase(),has=v=>v.toLowerCase().includes(q);return (global?projects.map((v,i)=>has(v)?item('project',i,v,t('项目','Project')):'').join(''):'')+sessions.map((v,i)=>{const w=works[v.w];return(global||w.p===p)&&has([name(i),wname(v.w),v.r||'',projects[w.p]].join(' '))?item('session',i,name(i),projects[w.p]+' / '+kind(i)):''}).join('')||`<p>${t('没有匹配的对话','No matching chats')}</p>`}
function drawer(){const d=$('panel');if(!panel){d.innerHTML='';return}let b='';if(panel==='projects')b=projects.map((v,i)=>item('project',i,v,i===p?t('当前项目','Current project'):'')).join('');if(panel==='search'||panel==='history')b=`<input id="query" value="${esc(filter)}" aria-label="${txt(titles[panel])}" placeholder="${t('搜索标题或编号','Find by title or ID')}"><div id="hits">${matches()}</div>`;if(panel==='tools')b=['agents','space','prefs'].map(v=>item('panel',v,txt(titles[v]))).join('');if(panel==='space')b=`<p>${projects[p]}</p><p>${t('查看或登记本项目已授权的执行目录。','View or register an authorized workspace directory for this project.')}</p>`;if(panel==='prefs')b=`<p>${t('显示语言与个人偏好','Language and preferences')}</p>`+btn('lang','',t('English','中文'),'outline');if(panel==='agents')b=agents.map(v=>item('agent',v,v,t('以此智能体新建工作','Start work with this agent'))).join('');if(panel==='inbox')b=item('todo',3,txt(titles.task),'SH-202 / '+wname(0));if(panel==='task')b=`<p>${t('已定位到相关运行；此草图不提交复核决定。','The related run is open. This prototype does not submit review decisions.')}</p>`;if(panel==='details'){b=section(t('运行记录','Runs'),s===null?'—':sessions.map((v,i)=>v.w===sessions[s].w&&v.r?item('session',i,name(i),v.r):'').join('')||'—')+section(t('文件成果','Files'),t('示例未登记文件。','No files in this example.'))+(s!==null?btn('panel','run',txt(titles.run),'link'):'')+section(t('项目资料','Project details'),btn('panel','space',txt(titles.space),'link'))}if(panel==='run')b=`<p>${t('正式系统在确认模型、输入和工作空间后才发起运行。此草图不执行。','In the live system, confirm the model, inputs and workspace before starting. No run is executed here.')}</p>`;if(panel==='new')b=`<form id="new"><p>${t('所属项目','Project')}: ${projects[p]}</p><label>${t('工作名称','Work name')}<input name="name" maxlength="64" required></label><label>${t('使用智能体','Agent')}<select name="agent">${agents.map(v=>`<option ${app===v?'selected':''}>${v}</option>`).join('')}</select></label><button class="action">${t('创建示例工作并打开','Create demo work and open')}</button></form>`;d.innerHTML=`<div class="phead"><h2>${txt(titles[panel])}</h2>${btn('dismiss','',t('关闭','Close'),'outline')}</div>${b}`;if($('query'))$('query').oninput=e=>{filter=e.target.value;$('hits').innerHTML=matches()};if($('new'))$('new').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),n=f.get('name').trim();if(!n)return;const w=works.push({p,n:[n,n],a:f.get('agent')})-1;openChat(sessions.push({w})-1)}}
function paint(){chrome();conversation();drawer()}function openChat(i,fail=false,after=''){if(mode==='ready'&&s!==null&&s!==i)prev=s;const k=++version;p=works[sessions[i].w].p;s=i;mode='loading';panel='';paint();$('title').focus();setTimeout(()=>{if(k!==version)return;mode=fail?'error':'ready';if(!fail){last[p]=i;if(sessions[i].r)rec=[i,...rec.filter(v=>v!==i)]}panel=after;paint()},160)}function project(i){if(last[i]!=null)return openChat(last[i]);if(mode==='ready'&&s!==null)prev=s;version++;p=i;s=null;mode='empty';panel='';paint();$('title').focus()}function show(v,el){panel=v;filter='';invoker=el;drawer();($('query')||$('panel').querySelector('input,button'))?.focus()}function dismiss(){panel='';drawer();if(invoker?.isConnected)invoker.focus();else $('title').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('form')&&!b.hasAttribute('data-dismiss'))return;const x=b.dataset;if('menu'in x){$('layout').classList.add('menuopen');return}$('layout').classList.remove('menuopen');if('project'in x)project(+x.project);else if('work'in x)openChat(wSession(+x.work));else if('session'in x)openChat(+x.session);else if('back'in x&&prev!==null)openChat(prev);else if('lang'in x){en=!en;document.documentElement.lang=en?'en':'zh-CN';paint()}else if('panel'in x){if(x.panel==='new')app=agents[0];show(x.panel,b)}else if('dismiss'in x)dismiss();else if('fail'in x)openChat(3,true);else if('retry'in x)openChat(s);else if('todo'in x)openChat(+x.todo,false,'task');else if('agent'in x){app=x.agent;show('new',b)}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(panel)dismiss();$('layout').classList.remove('menuopen')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();show('search',document.activeElement)}});paint();
</script></body></html>
